openapi: 3.0.3
info:
  title: API Gateway
  version: 1.0.0
  description: |
    Single entry point to the system. The gateway routes requests to the
    corresponding microservices based on path.

    ## Authentication
    Most endpoints require a valid JWT:
    ```
    Authorization: Bearer <access_token>
    ```
    The token is obtained from `POST /api/v1/auth/login` (see `auth-service.yaml`).

    ## Internal headers (service-to-service only)
    The gateway adds these headers before forwarding the request upstream:
    - `X-User-Id`: authenticated user's UUID
    - `X-User-Role`: user's role (CUSTOMER, RECEPTIONIST, VETERINARIAN, GROOMER, ADMIN —
      see `02-domain/domain-map.md` "Identity & Access")
    - `X-Correlation-Id`: trace ID to correlate logs

servers:
  - url: http://localhost:8080
    description: Local development
  - url: https://api.dev.{domain}
    description: Development
    variables:
      domain:
        default: example.com
  - url: https://api.{domain}
    description: Production
    variables:
      domain:
        default: example.com

tags:
  - name: Health
    description: Gateway and upstream service status

paths:
  /health:
    get:
      summary: Gateway health check
      description: |
        Verifies the gateway is running and every upstream service is
        responding. No authentication required.
      tags:
        - Health
      security: []
      responses:
        '200':
          description: Gateway and upstreams healthy
          content:
            application/json:
              schema:
                type: object
                required: [status, timestamp]
                properties:
                  status:
                    type: string
                    enum: [ok, degraded]
                  timestamp:
                    type: string
                    format: date-time
                  upstreams:
                    type: object
                    description: Status of each microservice
                    additionalProperties:
                      type: string
                      enum: [ok, degraded, down]
              example:
                status: ok
                timestamp: '2024-01-15T10:30:00Z'
                upstreams:
                  auth-service: ok
                  catalog-service: ok
                  sales-service: ok
                  scheduling-service: ok
                  clinical-service: ok
        '503':
          description: The gateway is starting up or a critical upstream is down
          content:
            application/json:
              schema:
                $ref: './_shared.yaml#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      $ref: './_shared.yaml#/components/securitySchemes/bearerAuth'

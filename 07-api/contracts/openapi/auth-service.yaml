openapi: 3.0.3
info:
  title: Auth Service API
  version: 1.0.0
  description: |
    Identity & Access context: registration, login, staff/customer lookup. Owns the
    `User` aggregate. See `02-domain/domain-map.md` — Identity & Access bounded context.

    ## Authentication flow
    1. `POST /auth/register` — self-service customer registration
    2. `POST /auth/login` — returns an access token
    3. Use the access token in the `Authorization: Bearer` header for protected endpoints

    ## Roles
    `CUSTOMER`, `RECEPTIONIST`, `VETERINARIAN`, `GROOMER`, `ADMIN` — see
    `02-domain/domain-map.md` "Identity & Access" for the full definition of each.

    ## Token signing
    The access token is a JWT signed with **RS256** (RSA private key). Every other
    service verifies it with the corresponding **public key** only — no service other
    than this one ever holds the private key. See `authentication.md` and `ADR-009`.

servers:
  - url: http://localhost:3000/api/v1
    description: Local development (monolith, mounted under /api/v1)
  - url: https://api.dev.{domain}/api/v1
    description: Development
    variables:
      domain:
        default: example.com
  - url: https://api.{domain}/api/v1
    description: Production
    variables:
      domain:
        default: example.com

tags:
  - name: identity
    description: Registration, login, staff and customer lookup

paths:
  /auth/register:
    post:
      summary: Self-service customer registration
      operationId: register
      tags: [identity]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: './_shared.yaml#/components/responses/BadRequest'
        '409':
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: './_shared.yaml#/components/schemas/ErrorResponse'
              example:
                error: EMAIL_ALREADY_EXISTS
                message: A user with this email already exists

  /auth/register-walk-in:
    post:
      summary: Register a walk-in customer on their behalf
      description: >
        Used by front-desk staff to create a customer account for someone buying
        or booking in person, without setting a password for them.
      operationId: registerWalkIn
      tags: [identity]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterWalkInCustomerRequest'
      responses:
        '201':
          description: Walk-in customer registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummary'
        '400':
          $ref: './_shared.yaml#/components/responses/BadRequest'
        '401':
          $ref: './_shared.yaml#/components/responses/Unauthorized'
        '403':
          description: Only a Receptionist may register walk-in customers
          content:
            application/json:
              schema:
                $ref: './_shared.yaml#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      summary: Authenticate a user
      operationId: login
      tags: [identity]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: './_shared.yaml#/components/schemas/ErrorResponse'
              example:
                error: INVALID_CREDENTIALS
                message: Email or password is incorrect

  /auth/staff:
    get:
      summary: List staff members
      description: Returns every user whose role is not CUSTOMER.
      operationId: listStaff
      tags: [identity]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of staff members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserSummary'
        '401':
          $ref: './_shared.yaml#/components/responses/Unauthorized'

  /auth/customers:
    get:
      summary: Find a customer by email
      description: Used at the front desk to look up an existing customer before checkout or booking.
      operationId: findCustomerByEmail
      tags: [identity]
      security:
        - bearerAuth: []
      parameters:
        - name: email
          in: query
          required: true
          schema:
            type: string
            format: email
      responses:
        '200':
          description: Customer found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummary'
        '401':
          $ref: './_shared.yaml#/components/responses/Unauthorized'
        '403':
          description: Only Receptionist or Admin may look up customers
          content:
            application/json:
              schema:
                $ref: './_shared.yaml#/components/schemas/ErrorResponse'
        '404':
          description: No customer found with that email
          content:
            application/json:
              schema:
                $ref: './_shared.yaml#/components/schemas/ErrorResponse'

components:
  schemas:
    RegisterRequest:
      type: object
      required: [fullName, email, password]
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 100
          example: Ana Torres
        email:
          type: string
          format: email
          example: ana@example.com
        password:
          type: string
          minLength: 8
          example: supersecret123
        phone:
          type: string
          example: "3001234567"

    RegisterWalkInCustomerRequest:
      type: object
      required: [fullName, email]
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 100
          example: Ana Torres
        email:
          type: string
          format: email
          example: ana@example.com
        phone:
          type: string
          example: "3001234567"

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: ana@example.com
        password:
          type: string
          example: supersecret123

    AuthResponse:
      type: object
      required: [userId, fullName, email, role, accessToken]
      properties:
        userId:
          $ref: './_shared.yaml#/components/schemas/UUID'
        fullName:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/UserRole'
        accessToken:
          type: string
          description: >
            JWT signed with RS256. Include in Authorization Bearer for authenticated
            requests. Verify with the identity service's public key only.

    UserSummary:
      type: object
      required: [userId, fullName, email, role]
      properties:
        userId:
          $ref: './_shared.yaml#/components/schemas/UUID'
        fullName:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        role:
          $ref: '#/components/schemas/UserRole'

    UserRole:
      type: string
      description: See 02-domain/domain-map.md — Identity & Access bounded context
      enum: [CUSTOMER, RECEPTIONIST, VETERINARIAN, GROOMER, ADMIN]

  securitySchemes:
    bearerAuth:
      $ref: './_shared.yaml#/components/securitySchemes/bearerAuth'

security:
  - bearerAuth: []

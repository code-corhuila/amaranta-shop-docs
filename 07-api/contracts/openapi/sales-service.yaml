openapi: 3.0.3
info:
  title: Sales Service API
  version: 1.0.0
  description: |
    Sales bounded context: owns the `Order` aggregate — cart-to-checkout flow,
    totals, and order status, for both online and in-store (receptionist-assisted)
    purchases. See `02-domain/domain-map.md` — Sales bounded context (Core subdomain).

    Error response shapes below are the ones verified against the running code, not the
    generic `_shared.yaml#ErrorResponse`. See `../sales-api-decisions.md` for why they
    differ and what closing that gap would take (G-1, G-2).

servers:
  - url: http://localhost:3000/api/v1
    description: Local development (monolith, mounted under /api/v1)
  - url: https://api.dev.{domain}/api/v1
    description: Development
    variables:
      domain:
        default: example.com
  - url: https://api.{domain}/api/v1
    description: Production
    variables:
      domain:
        default: example.com

security:
  - bearerAuth: []

tags:
  - name: sales
    description: Cart-to-checkout and order management

paths:
  /orders:
    get:
      summary: List the authenticated customer's own orders
      operationId: listMyOrders
      tags: [sales]
      responses:
        '200':
          description: List of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
        '401':
          description: No token, or a token that fails verification (`JwtAuthGuard`/`passport-jwt`'s default `handleRequest`).
          content:
            application/json:
              schema:
                $ref: './_shared.yaml#/components/schemas/NestDefaultErrorResponse'
    post:
      summary: Check out (online order)
      description: |
        Creates an order, channel ONLINE. **Auth is optional** — `OptionalJwtAuthGuard`, not
        `JwtAuthGuard` — see `../sales-api-decisions.md` (D-S1). An anonymous request is
        attributed to the walk-in customer; an authenticated one, to the caller.
      operationId: checkout
      tags: [sales]
      security:
        - {}
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: |
            Two different shapes reach a client here — see `../sales-api-decisions.md` §1 and §3.
            A request-shape problem (missing/invalid field) answers as `ValidationErrorResponse`.
            A business rule (store closed, duplicate product line, product not found, insufficient
            stock) answers as `DomainErrorResponse` — **including cases that are semantically a
            404 or a 409** (`PRODUCT_NOT_FOUND`, `INV-PRODUCT-002`); see gap G-1.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: './_shared.yaml#/components/schemas/ValidationErrorResponse'
                  - $ref: './_shared.yaml#/components/schemas/DomainErrorResponse'

  /orders/in-store:
    post:
      summary: Check out on behalf of a customer at the physical location
      description: |
        Receptionist-only. Creates an order, channel IN_STORE. Auth is **mandatory** here
        (`JwtAuthGuard` + `RolesGuard`, unlike `POST /orders` — see D-S1 in
        `../sales-api-decisions.md`).
      operationId: checkoutInStore
      tags: [sales]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InStoreCheckoutRequest'
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: |
            Same two shapes as `POST /orders` — see `../sales-api-decisions.md` §1 and §3.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: './_shared.yaml#/components/schemas/ValidationErrorResponse'
                  - $ref: './_shared.yaml#/components/schemas/DomainErrorResponse'
        '401':
          description: No token, or a token that fails verification.
          content:
            application/json:
              schema:
                $ref: './_shared.yaml#/components/schemas/NestDefaultErrorResponse'
        '403':
          description: Only a Receptionist may create in-store orders (`RolesGuard`).
          content:
            application/json:
              schema:
                $ref: './_shared.yaml#/components/schemas/NestDefaultErrorResponse'

  /orders/{orderId}/mark-paid:
    parameters:
      - name: orderId
        in: path
        required: true
        schema:
          $ref: './_shared.yaml#/components/schemas/UUID'
    post:
      summary: Mark an order as paid
      description: Receptionist-only, for cash/card/transfer payments taken in person.
      operationId: markOrderAsPaid
      tags: [sales]
      responses:
        '200':
          description: Order marked as paid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: |
            The order exists but is not `PENDING` (`INV-ORDER-005`) — semantically a conflict
            (409), reported as 400 today. See `../sales-api-decisions.md` gap G-1.
          content:
            application/json:
              schema:
                $ref: './_shared.yaml#/components/schemas/DomainErrorResponse'
        '401':
          description: No token, or a token that fails verification.
          content:
            application/json:
              schema:
                $ref: './_shared.yaml#/components/schemas/NestDefaultErrorResponse'
        '403':
          description: Only a Receptionist may mark an order as paid (`RolesGuard`).
          content:
            application/json:
              schema:
                $ref: './_shared.yaml#/components/schemas/NestDefaultErrorResponse'
        '404':
          description: No order exists with this id (`NotFoundException`, thrown directly by the use-case — not a `DomainException`).
          content:
            application/json:
              schema:
                $ref: './_shared.yaml#/components/schemas/NestDefaultErrorResponse'

components:
  schemas:
    FulfillmentMethod:
      type: string
      enum: [PICKUP, DELIVERY]

    PaymentMethod:
      type: string
      enum: [CASH, CARD, TRANSFER]

    OrderChannel:
      type: string
      enum: [ONLINE, IN_STORE]

    OrderStatus:
      type: string
      enum: [PENDING, PAID, CANCELLED, FULFILLED]

    CheckoutItem:
      type: object
      required: [productId, quantity]
      properties:
        productId:
          $ref: './_shared.yaml#/components/schemas/UUID'
        quantity:
          type: integer
          minimum: 1

    CheckoutRequest:
      type: object
      required: [items, fulfillmentMethod, paymentMethod, contactName, contactPhone]
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/CheckoutItem'
        fulfillmentMethod:
          $ref: '#/components/schemas/FulfillmentMethod'
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
        contactName:
          type: string
          example: Ana Torres
        contactPhone:
          type: string
          example: "3001234567"
        deliveryAddress:
          type: string
          description: Required when fulfillmentMethod is DELIVERY
          example: Calle 10 # 5-20, Neiva

    InStoreCheckoutRequest:
      allOf:
        - $ref: '#/components/schemas/CheckoutRequest'
        - type: object
          required: [customerId]
          properties:
            customerId:
              $ref: './_shared.yaml#/components/schemas/UUID'
              description: The customer this in-store order is placed for

    OrderItem:
      type: object
      required: [productId, quantity, unitPrice]
      properties:
        productId:
          $ref: './_shared.yaml#/components/schemas/UUID'
        quantity:
          type: integer
        unitPrice:
          type: integer
          description: Price in COP at the time of purchase (frozen snapshot)

    Order:
      allOf:
        - $ref: './_shared.yaml#/components/schemas/AuditFields'
        - type: object
          required:
            - id
            - customerId
            - channel
            - status
            - items
            - fulfillmentMethod
            - paymentMethod
            - total
          properties:
            id:
              $ref: './_shared.yaml#/components/schemas/UUID'
            customerId:
              $ref: './_shared.yaml#/components/schemas/UUID'
            channel:
              $ref: '#/components/schemas/OrderChannel'
            status:
              $ref: '#/components/schemas/OrderStatus'
            items:
              type: array
              items:
                $ref: '#/components/schemas/OrderItem'
            fulfillmentMethod:
              $ref: '#/components/schemas/FulfillmentMethod'
            paymentMethod:
              $ref: '#/components/schemas/PaymentMethod'
            total:
              type: integer
              description: Order total in COP

  securitySchemes:
    bearerAuth:
      $ref: './_shared.yaml#/components/securitySchemes/bearerAuth'
